; ============================================================================
;  PlatformIO — Huawei R4850G2 × ESP32 (CAN + Web UI + Home Assistant)
; ----------------------------------------------------------------------------
;  Скетч лишається у підпапці huawei_r4850g2_esp32 (див. src_dir нижче),
;  тож .ino та заголовки не переміщувались.
;
;  Корінь проєкту = ця папка (…\huawei-r4850g2-web\src).
;  У VS Code: "Open Folder" -> оберіть саме цю папку (src), PlatformIO
;  підхопить platformio.ini автоматично.
;
;  Команди:
;    pio run                 — зібрати
;    pio run -t upload       — прошити
;    pio device monitor      — серійний монітор (115200)
;    pio run -t clean        — очистити збірку
; ============================================================================

[platformio]
src_dir = huawei_r4850g2_esp32

[env:esp32dev]
platform  = espressif32
board     = esp32dev          ; класична ESP32 WROOM-32 (піни OLED 16/17 — саме під неї)
framework = arduino

; Перед кожною збіркою регенерувати превʼю веб-морди (preview/index.html)
; з index_html.h — щоб превʼю не розходилось з основною сторінкою:
extra_scripts = pre:tools/gen_preview.py

; .ino збирається як в Arduino IDE (авто-прототипи функцій) — переписувати нічого не треба.

; Більше місця під застосунок (WiFi + AsyncWebServer + MQTT + OLED), без OTA-розділу:
board_build.partitions = min_spiffs.csv   ; два app-розділи для OTA (web /update + ArduinoOTA)

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit SSD1306 @ ^2.5.0
    adafruit/Adafruit GFX Library @ ^1.11.0

; Прошивка через мережу (ArduinoOTA). Пароль = пароль вебінтерфейсу (дефолт admin).
;   pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = huawei-r4850.local
upload_flags = --auth=admin
